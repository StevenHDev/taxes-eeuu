openapi: 3.1.0

info:
  title: API de Recolección de Datos para Declaraciones de Impuestos
  version: "1.0.0"
  description: |
    API REST que recibe eventos de recolección de datos fiscales **un campo a la
    vez** desde un agente conversacional externo, y expone el panel interno de
    clientes/formularios/campos para preparadores y administradores.

    Esta especificación es la contraparte máquina-legible de `docs/api.md` — para
    el catálogo completo de campos por formulario (72 definiciones), las reglas de
    negocio detalladas y ejemplos curl adicionales, ver ese documento. Si algo
    difiere entre ambos, `docs/api.md` explica el porqué; este archivo describe el
    contrato técnico exacto.
  contact:
    name: GlobalTax Services

servers:
  - url: /api
    description: Relativo al dominio donde esté desplegada la app.

tags:
  - name: Eventos
    description: Recolección incremental de campos desde el agente conversacional.
  - name: Clientes
    description: Alta, listado, búsqueda y detalle de clientes.
  - name: Campos
    description: Historial, corrección y borrado de campos individuales de un cliente.

security:
  - BearerAuth: []

paths:
  /eventos:
    post:
      tags: [Eventos]
      operationId: emitirEvento
      summary: Emite un evento de recolección de un campo
      description: |
        Un evento = un solo campo, nunca varios juntos. Requiere ability
        `eventos:write`. `modo: "texto"` acepta JSON o multipart; `modo: "archivo"`
        exige `multipart/form-data` (el archivo va en el mismo request).

        El `estado` resultante (`recibido` / `invalido`) lo calcula siempre el
        servidor validando el contenido — un evento con contenido inválido igual
        se acepta y persiste con `estado: "invalido"`, no se rechaza con 422
        (salvo que la FORMA del evento esté mal: campo inexistente en el catálogo,
        `tipo_campo`/`modo` inconsistente, etc.).
      x-required-ability: eventos:write
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/EventoTexto'
                - $ref: '#/components/schemas/EventoNoAplica'
            examples:
              string:
                summary: Dato simple (string) — identificacion_ssn_itin
                value:
                  cliente_id: 42
                  forma: transversal
                  tax_year: 2025
                  campo: identificacion_ssn_itin
                  tipo_campo: dato
                  modo: texto
                  tipo_dato: string
                  contenido: "123-45-6789"
              number:
                summary: Dato numérico — impuestos_retenidos
                value:
                  cliente_id: 42
                  forma: form_1040
                  tax_year: 2025
                  campo: impuestos_retenidos
                  tipo_campo: dato
                  modo: texto
                  tipo_dato: number
                  contenido: 5200
              object:
                summary: Objeto — info_conyuge
                value:
                  cliente_id: 42
                  forma: transversal
                  tax_year: 2025
                  campo: info_conyuge
                  tipo_campo: dato
                  modo: texto
                  tipo_dato: object
                  contenido:
                    nombre_completo: Jane Doe
                    fecha_nacimiento: "1990-05-14"
                    ssn: "987-65-4321"
              object_ingresos:
                summary: Objeto desglosado — ingresos (Fase 2)
                value:
                  cliente_id: 42
                  forma: form_1040
                  tax_year: 2025
                  campo: ingresos
                  tipo_campo: dato
                  modo: texto
                  tipo_dato: object
                  contenido:
                    salarios: 52000
                    intereses_dividendos: 0
                    ganancias_capital: 0
                    ingresos_jubilacion: 0
                    otros_ingresos: 0
                    ajustes_ingreso: 0
              array_object:
                summary: Lista de objetos — info_dependientes (arreglo acumulado completo, 10 subcampos desde Fase 2)
                value:
                  cliente_id: 42
                  forma: transversal
                  tax_year: 2025
                  campo: info_dependientes
                  tipo_campo: dato
                  modo: texto
                  tipo_dato: array_object
                  contenido:
                    - nombre_completo: Kid One
                      fecha_nacimiento: "2015-03-01"
                      ssn: "111-22-3333"
                      relacion: hija
                      meses_en_hogar: 12
                      estudiante_tiempo_completo: false
                      discapacitado: false
                      provee_mas_50_soporte_propio: false
                      ingreso_bruto_anual: 0
                      custodia_compartida_sin_conflicto: false
              estado_civil:
                summary: Objeto — estado_civil (Fase 2, transversal — hechos, no la conclusión de filing status)
                value:
                  cliente_id: 42
                  forma: transversal
                  tax_year: 2025
                  campo: estado_civil
                  tipo_campo: dato
                  modo: texto
                  tipo_dato: object
                  contenido:
                    casado_al_31_dic: false
                    convivio_conyuge_ultimos_6_meses: false
                    costeo_mas_mitad_hogar: true
                    existe_persona_calificable: true
                    conyuge_fallecio_en_anio: false
                    anio_fallecimiento_conyuge: null
              gastos_cuidado_dependientes:
                summary: Objeto — gastos_cuidado_dependientes (Fase 2, mixto — dato + documento opcional)
                value:
                  cliente_id: 42
                  forma: form_1040
                  tax_year: 2025
                  campo: gastos_cuidado_dependientes
                  tipo_campo: dato
                  modo: texto
                  tipo_dato: object
                  contenido:
                    proveedor_nombre: Guardería Los Pinitos
                    proveedor_ssn_ein: "12-3456789"
                    monto_anual: 4800
                    dependiente_relacionado: Kid One
              no_aplica:
                summary: Campo opcional declinado — modo "no_aplica" (ej. declaracion_anio_anterior)
                value:
                  cliente_id: 42
                  forma: transversal
                  tax_year: 2025
                  campo: declaracion_anio_anterior
                  tipo_campo: documento
                  modo: no_aplica
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventoArchivo'
      responses:
        '201':
          description: Evento procesado (aceptado con `estado` recibido o inválido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoRespuesta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            La FORMA del evento está mal (no el contenido): falta `tax_year`,
            campo inexistente en el catálogo para esa forma **y ese año fiscal**,
            `tipo_campo`/`modo` inconsistente, `modo: "no_aplica"` sobre un
            campo `obligatorio: true`, falta un campo requerido, o el
            archivo supera 20 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /clientes:
    get:
      tags: [Clientes]
      operationId: listarClientes
      summary: Lista paginada de clientes visibles para el token
      description: 'Un preparador solo ve sus clientes asignados; un administrador ve todos. 20 por página.'
      x-required-ability: clientes:read
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: Busca por nombre, email o teléfono.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tax_year
          in: query
          description: |
            Opcional. Escopea `estado_general` de cada cliente a las formas de
            ese año fiscal. Si se omite, usa el año fiscal actual configurado
            en la plataforma (default de conveniencia, no aplica al camino del
            agente conversacional — ver `docs/api.md#año-fiscal-taxyear`).
          schema:
            type: integer
      responses:
        '200':
          description: Página de clientes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClienteResumen'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                    required: [current_page, last_page]
                  tax_year:
                    type: integer
                    description: El año fiscal efectivamente usado (el pasado, o el default si se omitió).
                required: [data, meta, tax_year]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Clientes]
      operationId: crearCliente
      summary: Da de alta un cliente
      description: |
        Pensado para crear al cliente con datos reales **antes** de emitir
        eventos, en vez de dejar que `POST /eventos` genere el placeholder
        "Cliente sin nombre" cuando `cliente_id` llega vacío.
      x-required-ability: clientes:write
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 32
                  nullable: true
                preparer_id:
                  type: integer
                  nullable: true
                  description: Solo lo usa un administrador — un preparador se asigna a sí mismo automáticamente.
              required: [name, email]
      responses:
        '201':
          description: Cliente creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteDetalle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /clientes/buscar:
    get:
      tags: [Clientes]
      operationId: buscarCliente
      summary: Busca un cliente por id, teléfono o email
      description: |
        Útil para que el agente conversacional resuelva el `cliente_id` a partir
        del teléfono o el email antes de emitir eventos, en vez de depender de
        `external_ref`. Hace falta exactamente uno de los tres parámetros.
      x-required-ability: clientes:read
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          schema:
            type: integer
        - name: phone
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
            format: email
        - name: tax_year
          in: query
          description: Opcional — default = año fiscal actual de la plataforma. Ver `docs/api.md#año-fiscal-taxyear`.
          schema:
            type: integer
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteDetalle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clientes/{cliente}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Detalle de un cliente — formas + todos sus campos y estado
      description: Incluye todas las formas aplicables y todos los campos cargados, con su valor (enmascarado si es sensible) y estado, escopeados al año fiscal resuelto.
      x-required-ability: clientes:read
      security:
        - BearerAuth: []
      parameters:
        - name: tax_year
          in: query
          description: Opcional — default = año fiscal actual de la plataforma. Ver `docs/api.md#año-fiscal-taxyear`.
          schema:
            type: integer
      responses:
        '200':
          description: Detalle del cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteDetalle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clientes/{cliente}/documentos:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      tags: [Clientes]
      operationId: listarDocumentos
      summary: Documentos subidos por el cliente
      description: Cada documento incluye una URL de descarga firmada y temporal (10 minutos), escopeado al año fiscal resuelto.
      x-required-ability: clientes:read
      security:
        - BearerAuth: []
      parameters:
        - name: tax_year
          in: query
          description: Opcional — default = año fiscal actual de la plataforma. Ver `docs/api.md#año-fiscal-taxyear`.
          schema:
            type: integer
      responses:
        '200':
          description: Lista de documentos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Documento'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clientes/{cliente}/export:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      tags: [Clientes]
      operationId: exportarCliente
      summary: Descarga un ZIP con documentos + JSON de campos del cliente
      description: El ZIP incluye los documentos y el JSON de campos de un año fiscal — no de todos los años del cliente mezclados.
      x-required-ability: clientes:read
      security:
        - BearerAuth: []
      parameters:
        - name: tax_year
          in: query
          description: Opcional — default = año fiscal actual de la plataforma. Ver `docs/api.md#año-fiscal-taxyear`.
          schema:
            type: integer
      responses:
        '200':
          description: Archivo ZIP.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clientes/{cliente}/marcar-revisado/{forma}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - name: forma
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TaxForm'
    post:
      tags: [Clientes]
      operationId: marcarFormaRevisada
      summary: Marca una forma del cliente como revisada por un humano
      description: |
        Registra que un preparador o administrador revisó manualmente esta forma,
        más allá de que sus campos estén completos. `tax_year` es obligatorio en
        el body — es una acción mutante con consecuencias de auditoría, no tiene
        default (ver `docs/api.md#año-fiscal-taxyear`).
      x-required-ability: clientes:write
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tax_year:
                  type: integer
              required: [tax_year]
      responses:
        '200':
          description: Forma marcada como revisada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  forma:
                    type: string
                  estado:
                    $ref: '#/components/schemas/FormState'
                  revisado_en:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clientes/{cliente}/formas:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    post:
      tags: [Clientes]
      operationId: declararFormasCliente
      summary: Declara las formas del IRS aplicables a un cliente (Fase 4)
      description: |
        El agente conversacional externo la invoca apenas resuelve, en lenguaje
        natural, su propio árbol de determinación de forma(s) — reemplaza la
        necesidad de que `formas_aplicables` viva solo en su memoria conversacional.
        `tax_year` y `formas` son ambos obligatorios (sin default). Idempotente:
        si una forma ya declarada está `completo`, volver a declararla no la
        resetea a `en_progreso`.
      x-required-ability: clientes:write
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tax_year:
                  type: integer
                formas:
                  type: array
                  items:
                    $ref: '#/components/schemas/TaxForm'
              required: [tax_year, formas]
            example:
              tax_year: 2025
              formas: [schedule_c, schedule_e]
      responses:
        '200':
          description: Formas declaradas — responde con el mismo shape que `GET /clientes/{cliente}/pendientes`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendientesRespuesta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /clientes/{cliente}/pendientes:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      tags: [Clientes]
      operationId: pendientesCliente
      summary: Qué campos faltan por recolectar, listos para preguntar (Fase 4)
      description: |
        El agente conversacional externo la llama después de cada evento
        (`guardar_campo_cliente`) para saber el siguiente campo a pedir —
        sustituye el catálogo hardcodeado que antes vivía como texto estático
        en su propio prompt. `tax_year` es obligatorio (sin default: es una
        consulta agente-facing, no una lectura de panel humano). Los campos
        transversales no dependen de que exista ninguna forma declarada — se
        piden sin importar cuál(es) apliquen, así que aparecen en `pendientes`
        aunque el cliente todavía no tenga ninguna forma declarada. En ese
        caso, `completo` es siempre `false` (la determinación de forma en sí
        sigue pendiente).
      x-required-ability: clientes:read
      security:
        - BearerAuth: []
      parameters:
        - name: tax_year
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Checklist pendiente del cliente para ese año fiscal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendientesRespuesta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

  /clientes/{cliente}/campos/{campo}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - $ref: '#/components/parameters/CampoNombre'
      - name: forma
        in: query
        required: true
        description: |
          Obligatoria: el mismo nombre de campo se repite en formas distintas con
          significado distinto (ej. `gastos` en `form_1065`, `form_1120`, etc.).
          Para campos únicos por cliente, usa `transversal`.
        schema:
          $ref: '#/components/schemas/FormaAlmacen'
      - name: tax_year
        in: query
        required: true
        description: |
          Obligatoria, igual que `forma`: identifica de forma única a qué año
          fiscal corresponde esta instancia del campo — no tiene default (ver
          `docs/api.md#año-fiscal-taxyear`).
        schema:
          type: integer
    get:
      tags: [Campos]
      operationId: historialCampo
      summary: Historial de cambios de un campo
      description: |
        **Los valores de este endpoint no se enmascaran** aunque el campo sea
        sensible — a diferencia del detalle del cliente, `valor_anterior` y
        `valor_nuevo` viajan en texto plano. Requiere `clientes:read`.
      x-required-ability: clientes:read
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Historial de cambios, más reciente primero.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistorialEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Campos]
      operationId: corregirCampo
      summary: Corrección manual de un campo por un preparador/administrador
      description: |
        Acepta el mismo shape que un evento (`modo` + `tipo_dato`/`contenido`,
        `file`, o `modo: "no_aplica"` sin body adicional para campos
        opcionales). Queda registrada en el historial con `source: "preparador"`
        o `"administrador"`. El límite de archivo es **10 MB** (más chico que
        `POST /eventos`, a propósito: es para correcciones puntuales, no la
        carga inicial del agente).
      x-required-ability: clientes:write
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CorreccionTexto'
                - $ref: '#/components/schemas/CorreccionNoAplica'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorreccionArchivo'
      responses:
        '200':
          description: Campo corregido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campo:
                    type: string
                  estado:
                    $ref: '#/components/schemas/FieldState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'

    delete:
      tags: [Campos]
      operationId: eliminarCampo
      summary: Elimina un campo cargado por error
      description: 'Borra el documento/archivo asociado si lo tenía. Agrega una entrada final al historial con `valor_nuevo: null` — no se pierde trazabilidad.'
      x-required-ability: clientes:write
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Campo eliminado, sin contenido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Laravel Sanctum personal access token"
      description: |
        Token personal creado desde **Settings → API Tokens** en la sesión web.
        Cada token declara sus abilities al crearse:

        | Ability | Habilita |
        |---|---|
        | `eventos:write` | `POST /eventos` — pensado para un token de servicio de un solo propósito, dedicado al agente conversacional. |
        | `clientes:read` | Listar/ver clientes, historial de campos, documentos, export. |
        | `clientes:write` | Alta de cliente, corrección de campos, marcar revisado, borrado de campo. |
        | `clientes:reveal-sensitive` | Reservado para uso futuro — hoy "reveal" solo existe en el panel web con sesión. |

        Un endpoint que requiera una ability que el token no tiene responde `403`.

  parameters:
    ClienteId:
      name: cliente
      in: path
      required: true
      schema:
        type: integer

    CampoNombre:
      name: campo
      in: path
      required: true
      schema:
        type: string

  schemas:
    TaxForm:
      type: string
      enum: [form_1040, schedule_c, schedule_e, form_1065, form_1120, form_1120_s, schedule_f, form_1041, form_990, form_1040_nr]
      description: Las 10 formas del IRS soportadas.

    FormaAlmacen:
      description: Una de las 10 formas, o `transversal` para los campos únicos por cliente.
      oneOf:
        - $ref: '#/components/schemas/TaxForm'
        - type: string
          enum: [transversal]

    FieldKind:
      type: string
      enum: [documento, dato, mixto]
      description: '`documento` admite `modo: archivo`; `dato` admite `modo: texto`; `mixto` admite cualquiera. Los tres admiten además `modo: no_aplica` si el campo es opcional (`obligatorio: false`).'

    FieldMode:
      type: string
      enum: [archivo, texto, no_aplica]
      description: '`no_aplica` registra que el cliente fue consultado por un campo opcional y respondió que no lo tiene — nunca válido sobre un campo `obligatorio: true` (responde 422).'

    FieldDataType:
      type: string
      enum: [string, number, object, array_string, array_object]
      description: 'Solo aplica cuando `modo: texto`.'

    FieldState:
      type: string
      enum: [pendiente, recibido, invalido, no_aplica]
      description: '`no_aplica`: el cliente fue consultado por un campo opcional y respondió que no lo tiene — a diferencia de `pendiente`, es una respuesta explícita, no la ausencia de una.'

    FormState:
      type: string
      enum: [en_progreso, completo]

    EventSource:
      type: string
      enum: [agente_ia, preparador, administrador]

    EventoTexto:
      type: object
      description: |
        Shape para `modo: "texto"`. El catálogo completo de campos válidos por
        forma (con su `tipo_campo`/`tipo_dato`/`formatos_aceptados` exactos) está
        en `docs/api.md#catálogo-maestro-de-campos` — son 72 definiciones,
        administrables desde `/catalogo`, demasiadas para enumerar aquí sin que
        este archivo quede desactualizado apenas alguien edite el catálogo.
      properties:
        cliente_id:
          type: integer
          nullable: true
          description: Vacío/null = primer contacto, la API crea un cliente placeholder.
        external_ref:
          type: string
          maxLength: 255
          nullable: true
        phone:
          type: string
          maxLength: 32
          nullable: true
        forma:
          $ref: '#/components/schemas/FormaAlmacen'
        tax_year:
          type: integer
          description: |
            Año fiscal, obligatorio y sin default — el catálogo y los datos del
            cliente están versionados por año (ver `docs/api.md#año-fiscal-taxyear`).
        campo:
          type: string
        tipo_campo:
          $ref: '#/components/schemas/FieldKind'
        modo:
          type: string
          enum: [texto]
        tipo_dato:
          $ref: '#/components/schemas/FieldDataType'
        contenido:
          description: string, number, object o array según `tipo_dato` — ver ejemplos.
        nombre_original:
          type: string
          maxLength: 255
          nullable: true
        acumular:
          type: boolean
          default: false
          description: |
            Fase 6. Si es `true`, suma `contenido` (o, con `subcampo`
            indicado, el valor de esa clave dentro de `contenido`) al valor ya
            guardado para ese campo/subcampo en vez de sobrescribirlo — solo
            válido cuando `tipo_dato` es `number`, o `object` con `subcampo`
            presente (ver `RelacionRevelada.acumulable` y
            `docs/api.md#acumular-en-vez-de-sobrescribir-acumular--subcampo`).
            Sin efecto en la corrección manual de un preparador, que siempre
            sobrescribe.
        subcampo:
          type: string
          nullable: true
          description: |
            Solo junto con `acumular: true` sobre un campo `tipo_dato: object`
            — el subcampo exacto de `contenido` que se debe sumar (los demás
            subcampos del objeto se guardan tal como llegan).
      required: [forma, tax_year, campo, tipo_campo, modo]

    EventoArchivo:
      type: object
      description: 'Shape para `modo: archivo` — siempre `multipart/form-data`. Máximo 20 MB.'
      properties:
        cliente_id:
          type: integer
          nullable: true
        external_ref:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        forma:
          $ref: '#/components/schemas/FormaAlmacen'
        tax_year:
          type: integer
          description: Año fiscal, obligatorio y sin default — ver `docs/api.md#año-fiscal-taxyear`.
        campo:
          type: string
        tipo_campo:
          $ref: '#/components/schemas/FieldKind'
        modo:
          type: string
          enum: [archivo]
        file:
          type: string
          format: binary
        nombre_original:
          type: string
          nullable: true
      required: [forma, tax_year, campo, tipo_campo, modo, file]

    EventoNoAplica:
      type: object
      description: |
        Shape para `modo: "no_aplica"` (JSON puro, nunca multipart aunque el
        `tipo_campo` sea `documento` o `mixto`) — el cliente fue consultado
        por un campo opcional (`obligatorio: false`) y respondió que no lo
        tiene o que no aplica en su caso. Sin `tipo_dato` ni `contenido`: no
        hay ningún valor que describir. Usarlo sobre un campo con
        `obligatorio: true` responde 422 — ver `docs/api.md#modo-no_aplica--el-cliente-respondió-que-no-tiene-ese-campo-solo-opcionales`.
      properties:
        cliente_id:
          type: integer
          nullable: true
        external_ref:
          type: string
          maxLength: 255
          nullable: true
        phone:
          type: string
          maxLength: 32
          nullable: true
        forma:
          $ref: '#/components/schemas/FormaAlmacen'
        tax_year:
          type: integer
        campo:
          type: string
        tipo_campo:
          $ref: '#/components/schemas/FieldKind'
        modo:
          type: string
          enum: [no_aplica]
      required: [forma, tax_year, campo, tipo_campo, modo]

    CorreccionTexto:
      allOf:
        - $ref: '#/components/schemas/EventoTexto'
        - type: object
          properties:
            cliente_id: false
            external_ref: false
            phone: false

    CorreccionNoAplica:
      allOf:
        - $ref: '#/components/schemas/EventoNoAplica'
        - type: object
          properties:
            cliente_id: false
            external_ref: false
            phone: false

    CorreccionArchivo:
      allOf:
        - $ref: '#/components/schemas/EventoArchivo'
        - type: object
          description: Igual que `EventoArchivo`, pero el límite es 10 MB, no 20 MB.

    EventoRespuesta:
      type: object
      properties:
        cliente_id:
          type: integer
        forma:
          $ref: '#/components/schemas/FormaAlmacen'
        forma_estado:
          $ref: '#/components/schemas/FormState'
          nullable: true
        campo:
          type: string
        estado:
          $ref: '#/components/schemas/FieldState'
        revela:
          type: array
          description: |
            Repite el mismo `revela` que ya traía esta entrada en la última
            respuesta de consultar_pendientes_cliente, para que el agente no
            dependa de recordarlo de un turno anterior — encontrado en
            producción con modelos pequeños sobre prompts largos: el agente
            guardaba el documento principal pero nunca encadenaba las llamadas
            para sus campos revelados. Vacío para casi todo campo `dato`.
          items:
            $ref: '#/components/schemas/RelacionRevelada'
      required: [cliente_id, forma, campo, estado, revela]

    ClienteResumen:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        estado_general:
          $ref: '#/components/schemas/FormState'
          nullable: true

    Forma:
      type: object
      properties:
        forma:
          $ref: '#/components/schemas/TaxForm'
        estado:
          $ref: '#/components/schemas/FormState'
        revisado_en:
          type: string
          format: date-time
          nullable: true

    Campo:
      type: object
      properties:
        forma:
          $ref: '#/components/schemas/FormaAlmacen'
        campo:
          type: string
        tipo_campo:
          $ref: '#/components/schemas/FieldKind'
        modo:
          $ref: '#/components/schemas/FieldMode'
        estado:
          $ref: '#/components/schemas/FieldState'
        valor:
          description: |
            Enmascarado automáticamente si el campo es sensible (ej.
            `"***-**-6789"`). Revelar el valor real solo es posible desde el
            panel web con sesión — ver `docs/api.md#revelar-campos-sensibles`.
        updated_at:
          type: string
          format: date-time

    ClienteDetalle:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        tax_year:
          type: integer
          description: Año fiscal al que corresponden `formas` y `campos` — el pasado por `?tax_year=`, o el default de la plataforma si se omitió.
        formas:
          type: array
          items:
            $ref: '#/components/schemas/Forma'
        campos:
          type: array
          items:
            $ref: '#/components/schemas/Campo'

    Documento:
      type: object
      properties:
        id:
          type: integer
        forma:
          $ref: '#/components/schemas/FormaAlmacen'
        campo:
          type: string
        file_original_name:
          type: string
        formato:
          type: string
        estado_validacion:
          $ref: '#/components/schemas/FieldState'
        download_url:
          type: string
          format: uri
          description: Firmada y temporal — expira a los 10 minutos.
        created_at:
          type: string
          format: date-time

    HistorialEntry:
      type: object
      properties:
        valor_anterior:
          nullable: true
          description: Sin enmascarar, incluso para campos sensibles.
        valor_nuevo:
          nullable: true
          description: Sin enmascarar, incluso para campos sensibles.
        source:
          $ref: '#/components/schemas/EventSource'
        modificado_por:
          type: string
          nullable: true
          description: Nombre de quien hizo el cambio (null si `source` es `agente_ia`).
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [message, errors]

    PendienteCampo:
      type: object
      description: |
        Un campo del catálogo que al cliente le falta entregar. Los campos
        transversales (`unico_por_cliente`) aparecen una sola vez sin importar
        cuántas formas tenga el cliente; los propios de cada forma nunca se
        deduplican entre formas (ej. `estados_bancarios` de `schedule_c` y de
        `schedule_e` son dos pendientes distintas). Un campo deja de aparecer
        acá tanto si ya tiene `estado: "recibido"` como si se guardó con
        `modo: "no_aplica"` (solo posible cuando `obligatorio: false`) — ambos
        son una respuesta resuelta, no la ausencia de una.
      properties:
        forma:
          $ref: '#/components/schemas/FormaAlmacen'
        campo:
          type: string
        tipo_campo:
          $ref: '#/components/schemas/FieldKind'
        tipo_dato:
          $ref: '#/components/schemas/FieldDataType'
          nullable: true
        subcampos:
          type: array
          items:
            type: string
          nullable: true
        formatos_aceptados:
          type: array
          items:
            type: string
          nullable: true
        obligatorio:
          type: boolean
        sensible:
          type: boolean
        revela:
          type: array
          description: |
            Fase 5. Campos-destino que este documento ya resuelve si el
            cliente lo entrega, respaldados por la tabla
            `relaciones_documento_campo` del catálogo — nunca memorizados en
            el prompt del agente conversacional. Casi siempre vacío para
            campos `tipo_campo: dato`.
          items:
            $ref: '#/components/schemas/RelacionRevelada'

    RelacionRevelada:
      type: object
      description: |
        Una relación confirmada "este documento ya trae el valor de ese otro
        campo" (ej. w2 revela form_1040.ingresos.salarios). Ver
        `App\Models\RelacionDocumentoCampo` y `RelacionesDocumentoCampoSeeder`.
      properties:
        forma:
          $ref: '#/components/schemas/FormaAlmacen'
        campo:
          type: string
        subcampo:
          type: string
          nullable: true
          description: Subcampo exacto dentro de `campo` cuando el destino es `object`/`array_object`; `null` si el destino es un valor simple.
        descripcion:
          type: string
          description: Explicación en lenguaje natural de la relación, para que el agente conversacional entienda qué casilla del documento corresponde.
        acumulable:
          type: boolean
          description: |
            Fase 6. Si es `true`, este campo/subcampo destino puede ser
            resuelto por MÁS de un documento distinto (ej.
            `impuestos_retenidos` por w2 y por form_1099_nec, cada uno con su
            propia retención) — el agente debe enviar `acumular: true` (y
            `subcampo` si aplica) en `POST /eventos` para que la plataforma
            SUME el nuevo valor al ya guardado en vez de sobrescribirlo. Si es
            `false`, el destino solo lo resuelve este documento — comportamiento
            histórico, sin cambios.

    PendientesRespuesta:
      type: object
      description: |
        Respuesta compartida entre `POST /clientes/{cliente}/formas` y
        `GET /clientes/{cliente}/pendientes` (Fase 4).
      properties:
        tax_year:
          type: integer
        completo:
          type: boolean
          description: 'Calculado solo sobre los pendientes con `obligatorio: true`.'
        pendientes:
          type: array
          items:
            $ref: '#/components/schemas/PendienteCampo'
        siguiente:
          type: object
          nullable: true
          description: |
            Puntero de conveniencia al primer elemento de `pendientes` en el
            orden en que ya vienen (o `null` si `pendientes` está vacío).
            Desde la Fase 5 NO filtra por `obligatorio` — puede señalar un
            campo opcional (ej. un documento) antes que uno obligatorio, a
            propósito: le da al agente la oportunidad de ofrecer el documento
            (y aprovechar su `revela`) antes de pedir un dato manual que ese
            documento ya resuelve. `completo` sigue evaluando solo los
            pendientes obligatorios.
          properties:
            forma:
              $ref: '#/components/schemas/FormaAlmacen'
            campo:
              type: string

  responses:
    Unauthorized:
      description: Token ausente, inválido o revocado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.

    Forbidden:
      description: Token sin la ability requerida, o el cliente/preparador no tiene acceso a ese recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "El token no tiene la ability requerida: clientes:read"

    NotFound:
      description: El cliente, campo o documento no existe (o no es visible para este token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationErrorResponse:
      description: La request está mal formada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
